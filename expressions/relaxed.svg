<svg xmlns="http://www.w3.org/2000/svg" id="portrait" width="600" height="720" viewBox="0 0 600 720" fill="none" data-expression="relaxed" data-side="left" role="img" aria-labelledby="portrait-title portrait-description">
  <title id="portrait-title">A relaxed caricature portrait</title>
  <desc id="portrait-description">An editable vector caricature with swept-back dark hair, a broad forehead, expressive eyebrows, closed eyes, a rounded nose, a soft smile, and a charcoal T-shirt. Change data-expression to happy, relaxed, slapped, or sad. Every shape is a vector path.</desc>
  <defs>
    <linearGradient id="face-light" x1="382" y1="230" x2="155" y2="450" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff1d6" stop-opacity=".19"/><stop offset=".6" stop-color="#fff1d6" stop-opacity="0"/><stop offset="1" stop-color="#42291e" stop-opacity=".12"/>
    </linearGradient>
    <linearGradient id="nose-light" x1="323" y1="345" x2="282" y2="411" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffe6bb" stop-opacity=".03"/><stop offset=".7" stop-color="#ffe6bb" stop-opacity=".27"/><stop offset="1" stop-color="#ffe6bb" stop-opacity=".05"/>
    </linearGradient>
    <radialGradient id="cheek-glow"><stop stop-color="var(--blush, #d66a64)" stop-opacity=".55"/><stop offset="1" stop-color="var(--blush, #d66a64)" stop-opacity="0"/></radialGradient>
    <radialGradient id="impact-glow"><stop stop-color="var(--blush, #d66a64)" stop-opacity=".85"/><stop offset="1" stop-color="var(--blush, #d66a64)" stop-opacity=".15"/></radialGradient>
  </defs>
  <style>
    #portrait { --skin: #b88762; --hair: #211f20; --lips: #a75f59; --shirt: #242d32; --blush: #d66a64; --ink: #422e29; overflow: visible; }
    #portrait .skin { fill: var(--skin); }
    #portrait .hair { fill: var(--hair); }
    #portrait .lips { fill: var(--lips); }
    #portrait .outline { stroke: var(--ink); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    #portrait .line { stroke: var(--ink); stroke-linecap: round; stroke-linejoin: round; }
    #portrait .hair-line { stroke: var(--hair); stroke-linecap: round; stroke-linejoin: round; }
    #portrait .expression, #portrait .impact { display: none; }
    #portrait[data-expression="happy"] .expression-happy,
    #portrait[data-expression="relaxed"] .expression-relaxed,
    #portrait[data-expression="slapped"] .expression-slapped,
    #portrait[data-expression="sad"] .expression-sad { display: inline; }
    #portrait #head { transform-origin: 300px 555px; transition: transform 350ms cubic-bezier(.2,.75,.25,1); }
    #portrait[data-expression="sad"] #head { transform: translateY(8px) rotate(-2deg); }
    #portrait[data-expression="slapped"] #head { transform: translate(18px, 3px) rotate(7deg) scale(.965, 1.015); transition-duration: 90ms; }
    #portrait[data-expression="slapped"][data-side="right"] #head { transform: translate(-18px, 3px) rotate(-7deg) scale(.965, 1.015); }
    #portrait[data-expression="slapped"] .impact { display: inline; }
    #portrait .cheek-reaction { opacity: 0; transition: opacity 600ms ease; }
    #portrait[data-expression="slapped"][data-side="left"] #cheek-reaction-left,
    #portrait[data-expression="slapped"][data-side="right"] #cheek-reaction-right { opacity: .9; transition-duration: 70ms; }
    #portrait[data-reaction="true"][data-expression="sad"][data-side="left"] #cheek-reaction-left,
    #portrait[data-reaction="true"][data-expression="sad"][data-side="right"] #cheek-reaction-right { opacity: .28; }
    #portrait[data-side="right"] #impact-left, #portrait[data-side="left"] #impact-right { display: none; }
    #portrait[data-crop="head"] #body { display: none; }
    @media (prefers-reduced-motion: reduce) { #portrait #head, #portrait .cheek-reaction { transition: none; } }
  </style>

  <!-- Body is independent from the animated head. Set data-crop="head" to hide it. -->
  <g id="body">
