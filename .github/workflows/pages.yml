name: Deploy phone demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check and assemble
        run: |
          node --check face-rig.js
          node --check preview.js
          node --check motion-input.js
          node --test tests/*.test.cjs
          python3 build.py
          mkdir _site
          cp index.html portrait.svg head-only.svg face-rig.js motion-input.js preview.css preview.js expressions.html .nojekyll _site/
          cp -R expressions _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
